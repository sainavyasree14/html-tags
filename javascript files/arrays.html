    <script>
        //literal way

        console.log(arr[0]);

        samplearr.pop();
        console.log(samplearr);

        console.log(samplearr);

        console.log(samplearr.reverse());
        console.log(samplearr.toString());

        console.log(input1);
        console.log(input1.split(" ").reverse().toString().replaceAll(","," "));
