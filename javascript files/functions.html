        function outerfun(count){
                console.log("outer function");
                return function innerfun(){
                    return count++;
                }
        }
        let result1=outerfun(1)
        console.log(result1());
        console.log(result1());

        //higher order function
        function homepage(){
            console.log("home page");
            
        }
        function loginpage(){
            console.log("login page logic");
            
        }
        function registerpage(){
            console.log("register page logic");
            
        }
        homepage(registerpage(),loginpage()) /* homepage is higher order function and register,login page are callback function */
        function display(fun1,fun2){
            fun1();
            fun2();
        }
        display(()=>{
            console.log("1st callback function");
        },()=>{
            console.log("2nd order function");
        })  /* display is higher order function*/
       
        //generator  function
        function*generator() {
            yield 10;
            yield 20;
            yield 60;
            console.log("this is generator function");
        }
        let nextgen=generator();
        //nextgen.next()
        //generator().next()
        console.log(nextgen.next().done);
        console.log(nextgen.next().value);
        console.log(nextgen.next());
        console.log(nextgen.next().value);
        while(!nextgen.next().done){
            console.log(nextgen.next())
        }
