<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <fieldset>
            <h1>Login form</h1>
            <label for="" >Username:</label>
            <input type="text" id="Username" placeholder="enter your username"><br><br>
            <label for="">Password:</label>
            <input type="password" id="password" placeholder="enter your password"><br><br>
            <button type="submit">Submit</button>
            <button type="reset">Cancel</button>
        </fieldset>
    </form>
    <script>
        let uname=document.getElementById("Username");
        let psw=document.getElementById("password");
        let form=document.querySelector("form"); //query selector is used for selecting the first form when we are creating multiple forms in the code
        
        form.addEventListener("submit",(e)=>{ //e means any variable for storing
            e.preventDefault()
            console.log("Username:",uname.value);
            console.log("Password:",psw.value);
            //local storage means permanent storage , localStorage.setItem is used for storing the values in the local storage in key format and it does not deletes even browser close
            window.localStorage.setItem("Username",uname.value) //set item is used for storing the values in the local storage
            window.localStorage.setItem("Password",psw.value)
            let storedName=localStorage.getItem("Username")
            let storedPassword=localStorage.getItem("Password")
            console.log("stored username",storedName)
            console.log("stored password",storedPassword)
            
        })
    </script>
</body>
</html>
